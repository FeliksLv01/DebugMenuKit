name: Publish CocoaPods Spec

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish podspec
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate tag matches podspec version
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          PODSPEC_VERSION="$(ruby -e "body = File.read('DebugMenuKit.podspec'); puts body[/s\.version\s*=\s*['\"]([^'\"]+)['\"]/, 1]")"

          if [[ -z "${PODSPEC_VERSION}" ]]; then
            echo "Failed to read s.version from DebugMenuKit.podspec"
            exit 1
          fi

          if [[ "${TAG_NAME}" != "${PODSPEC_VERSION}" ]]; then
            echo "Tag ${TAG_NAME} does not match DebugMenuKit.podspec version ${PODSPEC_VERSION}"
            echo "DebugMenuKit.podspec uses :tag => s.version.to_s, so the release tag must be exactly ${PODSPEC_VERSION}."
            exit 1
          fi

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Configure git identity
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure source repo credentials
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Push podspec to private specs repo
        shell: bash
        env:
          TKSPECS_TOKEN: ${{ secrets.TKSPECS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${TKSPECS_TOKEN}" ]]; then
            echo "Missing TKSPECS_TOKEN secret. Configure a GitHub token with write access to TokenTeamiOS/TKSpecs."
            exit 1
          fi
          pod repo add tkspecs "https://x-access-token:${TKSPECS_TOKEN}@github.com/TokenTeamiOS/TKSpecs.git"
          pod repo push tkspecs DebugMenuKit.podspec --allow-warnings
